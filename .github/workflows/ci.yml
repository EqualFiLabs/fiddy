name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    name: Foundry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.1

      - name: Check formatting
        run: |
          forge fmt --check
          forge fmt --root integration --check

      - name: Build pre-FIDDY upgrade baseline
        run: bash script/build-legacy-baseline.sh

      - name: Build pinned Statics candidate independently
        run: forge build --config-path integration/foundry.toml

      - name: Build
        run: forge build

      - name: Verify shared ABI parity
        run: python3 script/check-statics-abi.py

      - name: Run lint
        run: forge lint

      - name: Test lifecycle validator mode selection
        run: bash script/test-validate-robinhood-testnet-lifecycle.sh

      - name: Run full test and fuzz suite
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vvv

  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Analyze contracts
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          fail-on: high
          slither-args: --filter-paths "lib/"
