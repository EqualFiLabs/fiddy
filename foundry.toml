[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 256
depth = 64
fail_on_revert = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[lint]
exclude_lints = ["mixed-case-variable", "mixed-case-function"]
