[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../../lib/operator-fee-router/lib"]
allow_paths = ["../.."]
solc = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
    "@openzeppelin/=../../lib/operator-fee-router/lib/openzeppelin-contracts/",
    "forge-std/=../../lib/operator-fee-router/lib/forge-std/src/",
    "operator-fee-router/=../../lib/operator-fee-router/",
]

[fmt]
line_length = 120
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
